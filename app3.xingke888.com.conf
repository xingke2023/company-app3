server {
    server_name app3.xingke888.com;

    access_log /var/log/nginx/app3.xingke888.com.access.log;
    error_log /var/log/nginx/app3.xingke888.com.error.log;

    # Backend: /api/, /admin, /livewire*, /filament, /storage, /up, /_boost, /fonts, /css, /js
    location ~ ^/(api|admin|livewire[^/]*|filament|storage|up|_boost|fonts|css|js)(/|$) {
        proxy_pass http://127.0.0.1:8302;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Frontend: everything else
    location / {
        proxy_pass http://127.0.0.1:3116;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    listen 80;
}
